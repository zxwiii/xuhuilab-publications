<script>
(function() {
  // 采用国内 Gitee 直连源（工信部备案节点，全国高校与宽带秒开）
  var giteeUser = window.XUHUILAB_GITEE_USER || "YOUR_GITEE_USERNAME";
  var giteeRepo = window.XUHUILAB_GITEE_REPO || "xuhuilab-publications";
  var giteeUrl = "https://gitee.com/" + giteeUser + "/" + giteeRepo + "/raw/master/publications_data.js?v=" + new Date().getTime();

  if (window.XUHUILAB_PUBLICATIONS && window.XUHUILAB_PUBLICATIONS.length > 0) {
    mountPublications();
  } else {
    var script = document.createElement("script");
    script.src = giteeUrl;
    script.onload = function() { mountPublications(); };
    script.onerror = function() {
      // 备用 jsDelivr 源
      var backupUrl = "https://fastly.jsdelivr.net/gh/" + giteeUser + "/" + giteeRepo + "@main/publications_data.js?v=" + new Date().getTime();
      var bScript = document.createElement("script");
      bScript.src = backupUrl;
      bScript.onload = function() { mountPublications(); };
      bScript.onerror = function() {
        document.getElementById("xuhui-pub-app").innerHTML =
          '<div style="text-align:center;padding:30px;color:#b31b1b;">' +
          '<h3>数据配置提醒</h3>' +
          '<p>请先在代码顶部配置您的 Gitee 用户名 <code>XUHUILAB_GITEE_USER</code>。</p>' +
          '</div>';
      };
      document.head.appendChild(bScript);
    };
    document.head.appendChild(script);
  }

  function mountPublications() {
    var root = document.getElementById("xuhui-pub-app");
    var publications = window.XUHUILAB_PUBLICATIONS || [];
    var stats = window.XUHUILAB_STATS || {};
    var currentLang = "cn";
    var activeYear = "all";
    var activeTopic = "all";
    var activeHighlight = "all";
    var searchQuery = "";

    var I18N = {
      cn: {
        title: "学术论文",
        sub_title: "Publications",
        lbl_highlights: "成果亮点 / Highlights",
        lbl_topics: "研究方向 / Research Topics",
        lbl_years: "发表年份 / Publication Years",
        opt_selected: "代表作 Selected",
        opt_esi: "ESI Top 1%",
        search_placeholder: "输入标题、作者、期刊或 DOI 实时检索...",
        showing: "当前显示:",
        unit: "篇论文",
        reset: "重置筛选条件",
        btn_doi: "DOI 直达",
        btn_cite: "复制引用",
        empty: "未找到符合条件的论文成果",
        copied: "引用信息已复制到剪贴板！"
      },
      en: {
        title: "Publications",
        sub_title: "Research Papers",
        lbl_highlights: "Highlights",
        lbl_topics: "Research Topics",
        lbl_years: "Publication Years",
        opt_selected: "Selected Works",
        opt_esi: "ESI Top 1%",
        search_placeholder: "Search by title, author, journal, or DOI...",
        showing: "Showing:",
        unit: "papers",
        reset: "Reset filters",
        btn_doi: "View DOI",
        btn_cite: "Copy Citation",
        empty: "No publications found",
        copied: "Citation copied to clipboard!"
      }
    };

    var TOPICS_CONFIG = [
      { id: 'co2', name_cn: 'CO2还原与转化', name_en: 'CO2 Reduction & Conversion' },
      { id: 'h2', name_cn: '制氢与全解水', name_en: 'H2 Evolution & Water Splitting' },
      { id: 'photocat', name_cn: '光催化', name_en: 'Photocatalysis' },
      { id: 'electrocat', name_cn: '电催化', name_en: 'Electrocatalysis' },
      { id: 'env', name_cn: '环境催化', name_en: 'Environmental Catalysis' },
      { id: 'biomass', name_cn: '生物质转化与有机合成', name_en: 'Biomass & Organic Synthesis' },
      { id: 'battery', name_cn: '电池与储能', name_en: 'Batteries & Energy Storage' }
    ];

    var YEAR_GROUPS = ['2026', '2025', '2024', '2023', '2022', '2021', '2020', '2019', '2018', '2017', '2016', '2015', '2014及以前'];

    function renderUI() {
      var d = I18N[currentLang];
      var html = '' +
        '<div class="xh-simple-header">' +
          '<div class="xh-title-box">' +
            '<h2>' + d.title + ' <span>' + d.sub_title + '</span></h2>' +
          '</div>' +
          '<div class="xh-lang-group">' +
            '<button class="xh-lang-btn ' + (currentLang==='cn'?'active':'') + '" id="xhBtnCn">中文</button>' +
            '<button class="xh-lang-btn ' + (currentLang==='en'?'active':'') + '" id="xhBtnEn">English</button>' +
          '</div>' +
        '</div>' +

        '<div class="xh-panel">' +
          '<div class="xh-filter-row">' +
            '<div class="xh-filter-label">' + d.lbl_highlights + '</div>' +
            '<div class="xh-tag-cloud" id="xhWrapHl">' +
              '<span class="xh-btn-tag xh-accent ' + (activeHighlight==='all'?'active':'') + '" data-val="all">全部 All</span>' +
              '<span class="xh-btn-tag xh-accent ' + (activeHighlight==='selected'?'active':'') + '" data-val="selected">' + d.opt_selected + '</span>' +
              '<span class="xh-btn-tag xh-accent ' + (activeHighlight==='esi'?'active':'') + '" data-val="esi">' + d.opt_esi + '</span>' +
            '</div>' +
          '</div>' +

          '<div class="xh-filter-row">' +
            '<div class="xh-filter-label">' + d.lbl_topics + '</div>' +
            '<div class="xh-tag-cloud" id="xhWrapTpc">' +
              '<span class="xh-btn-tag ' + (activeTopic==='all'?'active':'') + '" data-val="all">全部 All</span>';

      TOPICS_CONFIG.forEach(function(t) {
        var count = stats.topics ? (stats.topics[t.id] || 0) : 0;
        if (count > 0) {
          var tLabel = currentLang === 'cn' ? t.name_cn : t.name_en;
          html += '<span class="xh-btn-tag ' + (activeTopic===t.id?'active':'') + '" data-val="' + t.id + '">' + tLabel + ' (' + count + ')</span>';
        }
      });

      html += '</div></div>' +
          '<div class="xh-filter-row">' +
            '<div class="xh-filter-label">' + d.lbl_years + '</div>' +
            '<div class="xh-tag-cloud" id="xhWrapYr">' +
              '<span class="xh-btn-tag ' + (activeYear==='all'?'active':'') + '" data-val="all">全部 All</span>';

      YEAR_GROUPS.forEach(function(y) {
        var count = stats.years ? (stats.years[y] || 0) : 0;
        if (count > 0) {
          var yLabel = (y === '2014及以前' && currentLang === 'en') ? '≤2014' : y;
          html += '<span class="xh-btn-tag ' + (activeYear===y?'active':'') + '" data-val="' + y + '">' + yLabel + ' (' + count + ')</span>';
        }
      });

      html += '</div></div>' +
          '<div class="xh-search-row">' +
            '<input type="text" class="xh-search-input" id="xhSearchInp" placeholder="' + d.search_placeholder + '" value="' + searchQuery + '">' +
          '</div>' +
        '</div>' +

        '<div class="xh-bar">' +
          '<div>' + d.showing + ' <span class="xh-cnt" id="xhCountDisplay">0</span> / ' + publications.length + ' ' + d.unit + '</div>' +
          '<button class="xh-reset" id="xhResetBtn" style="display:none;">' + d.reset + '</button>' +
        '</div>' +

        '<div class="xh-stream" id="xhCardsStream"></div>';

      root.innerHTML = html;
      bindEvents();
      filterAndRender();
    }

    function bindEvents() {
      document.getElementById("xhBtnCn").onclick = function() { currentLang = "cn"; renderUI(); };
      document.getElementById("xhBtnEn").onclick = function() { currentLang = "en"; renderUI(); };

      document.querySelectorAll("#xhWrapHl .xh-btn-tag").forEach(function(el) {
        el.onclick = function() { activeHighlight = el.getAttribute("data-val"); renderUI(); };
      });
      document.querySelectorAll("#xhWrapTpc .xh-btn-tag").forEach(function(el) {
        el.onclick = function() { activeTopic = el.getAttribute("data-val"); renderUI(); };
      });
      document.querySelectorAll("#xhWrapYr .xh-btn-tag").forEach(function(el) {
        el.onclick = function() { activeYear = el.getAttribute("data-val"); renderUI(); };
      });

      document.getElementById("xhSearchInp").oninput = function(e) {
        searchQuery = e.target.value.trim().toLowerCase();
        filterAndRender();
      };

      document.getElementById("xhResetBtn").onclick = function() {
        activeYear = "all";
        activeTopic = "all";
        activeHighlight = "all";
        searchQuery = "";
        renderUI();
      };
    }

    function filterAndRender() {
      var isFiltered = (activeYear !== 'all' || activeTopic !== 'all' || activeHighlight !== 'all' || searchQuery !== '');
      var resetBtn = document.getElementById("xhResetBtn");
      if (resetBtn) resetBtn.style.display = isFiltered ? "inline-block" : "none";

      var filtered = publications.filter(function(item) {
        if (activeYear !== 'all') {
          if (activeYear === '2014及以前') {
            if (item.year > 2014) return false;
          } else {
            if (String(item.year) !== activeYear) return false;
          }
        }
        if (activeHighlight === 'selected' && !item.is_selected) return false;
        if (activeHighlight === 'esi' && !item.is_esi) return false;
        if (activeTopic !== 'all') {
          var hit = (item.topics || []).some(function(t) { return t.id === activeTopic; });
          if (!hit) return false;
        }
        if (searchQuery) {
          var text = (item.title + " " + item.authors + " " + item.journal + " " + item.doi + " " + item.year).toLowerCase();
          if (text.indexOf(searchQuery) === -1) return false;
        }
        return true;
      });

      var countEl = document.getElementById("xhCountDisplay");
      if (countEl) countEl.innerText = filtered.length;

      var stream = document.getElementById("xhCardsStream");
      if (!stream) return;

      if (filtered.length === 0) {
        stream.innerHTML = '<div style="text-align:center;padding:40px;background:#fff;border-radius:4px;color:#94a3b8;">' + I18N[currentLang].empty + '</div>';
        return;
      }

      var d = I18N[currentLang];
      var listHtml = filtered.map(function(item, idx) {
        var badgesHtml = '';
        if (item.is_selected) badgesHtml += '<span class="xh-badge xh-badge-sel">Selected</span>';
        if (item.is_esi) badgesHtml += '<span class="xh-badge xh-badge-esi">ESI Top 1%</span>';
        (item.badges || []).forEach(function(b) {
          if (b !== 'Selected' && b !== 'ESI Top 1%') {
            badgesHtml += '<span class="xh-badge xh-badge-top">' + b + '</span>';
          }
        });
        (item.topics || []).forEach(function(t) {
          var tLabel = currentLang === 'cn' ? t.name_cn : t.name_en;
          badgesHtml += '<span class="xh-badge xh-badge-tpc">' + tLabel + '</span>';
        });

        var linkUrl = item.url || (item.doi ? ("https://doi.org/" + item.doi) : "#");

        return '' +
          '<div class="xh-card ' + (item.is_selected ? 'is-selected' : '') + '">' +
            '<div class="xh-badge-row">' + badgesHtml + '</div>' +
            '<h3 class="xh-title"><a href="' + linkUrl + '" target="_blank" rel="noopener">' + item.title + '</a></h3>' +
            '<div class="xh-authors">' + item.authors + '</div>' +
            '<div class="xh-meta">' +
              '<span class="xh-journal">' + item.journal + '</span>' +
              '<span>•</span>' +
              '<span><strong>' + item.year + '</strong></span>' +
              (item.doi ? ('<span>•</span><span>DOI: ' + item.doi + '</span>') : '') +
            '</div>' +
            '<div class="xh-acts">' +
              (item.doi ? ('<a href="' + linkUrl + '" target="_blank" rel="noopener" class="xh-btn xh-btn-doi">' + d.btn_doi + '</a>') : '') +
              '<button class="xh-btn xh-btn-cite" onclick="window.xhCopy(' + idx + ')">' + d.btn_cite + '</button>' +
            '</div>' +
          '</div>';
      }).join('');

      stream.innerHTML = listHtml;

      window.xhCopy = function(idx) {
        var it = filtered[idx];
        if (!it) return;
        var cleanAuth = it.authors.replace(/<\/?[^>]+(>|$)/g, "");
        var txt = cleanAuth + ". " + it.title + ". " + it.journal + ", " + it.year + ". DOI: " + it.doi;
        navigator.clipboard.writeText(txt).then(function() {
          alert(I18N[currentLang].copied);
        }).catch(function() {
          prompt("复制引用文本：", txt);
        });
      };
    }

    renderUI();
  }
})();
</script>
